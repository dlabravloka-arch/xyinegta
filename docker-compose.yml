services:
  minecraft:
    build:
      context: ./server
      args:
        MC_VERSION: ${MC_VERSION:-1.21.1}
    container_name: mcp-minecraft
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      MEM: ${MC_MEM:-4G}
    volumes:
      - mc_world:/server/world
      - mc_world_nether:/server/world_nether
      - mc_world_end:/server/world_the_end
      - mc_logs:/server/logs
      - ./server/server.properties:/server/server.properties
    ports:
      - "25565:25565"

  website:
    build:
      context: ./website
    container_name: mcp-website
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/website.db
      MC_HOST: ${MC_HOST:-minecraft}
      MC_PORT: ${MC_PORT:-25565}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (set in .env)}
      PUBLIC_SERVER_NAME: ${PUBLIC_SERVER_NAME:-Minecraft Server}
      PUBLIC_SERVER_ADDRESS: ${PUBLIC_SERVER_ADDRESS:-mc.example.com}
      PUBLIC_DISCORD_URL: ${PUBLIC_DISCORD_URL:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID_5: ${STRIPE_PRICE_ID_5:-}
      STRIPE_PRICE_ID_10: ${STRIPE_PRICE_ID_10:-}
      STRIPE_PRICE_ID_25: ${STRIPE_PRICE_ID_25:-}
    volumes:
      - website_data:/data
    depends_on:
      - minecraft

  caddy:
    image: caddy:2-alpine
    container_name: mcp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-mc.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website

volumes:
  mc_world:
  mc_world_nether:
  mc_world_end:
  mc_logs:
  website_data:
  caddy_data:
  caddy_config:
